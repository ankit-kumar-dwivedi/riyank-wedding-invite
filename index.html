<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garima & Ankit - Wedding Invitation</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- 1. Selection Screen -->
    <div id="selection-screen" class="screen active watercolor-bg">
        <!-- Decorative Flowers -->
        <img class="floral-decor top-right" src="assets/flower-pastel.png" alt="flowers">

        <div class="fade-in frame-container">
            <!-- Overlapping geometric frames -->
            <div class="frame frame-1"></div>
            <div class="frame frame-2"></div>

            <div class="content-box">
                <div class="header-text">
                    <div class="ganesha-icon">
                        <img class="blend-image" src="assets/ganesha-pastel.png" width="100" alt="Ganesha">
                        <p class="ganesha-text">श्री गणेशाय नम:</p>
                    </div>
                    <h1 class="names">Garima <br><span class="weds">Weds</span><br> Ankit</h1>
                </div>

                <div class="selection-area">
                    <p class="selection-prompt">Please select your side</p>
                    <div class="buttons">
                        <a href="bride.html" id="btn-bride" class="btn primary-btn">Bride's Guests</a>
                        <a href="groom.html" id="btn-groom" class="btn primary-btn">Groom's Guests</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="credits">
            Made with love by <span class="hashtag">#Riyank</span>
        </div>

        <img class="floral-decor bottom-left" src="assets/flower-pastel.png" alt="flowers">
    </div>

    <!-- Invitation Screen is moved to invitation.html -->

    <script src="script.js"></script>
</body>

</html>
